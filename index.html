<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Rucher Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mon Rucher Pro</h1>
    <div id="compteur-cheptel">Ruches : 0 | Ruchettes : 0</div>
    <div class="btn-container">
        <button class="btn-add" style="background:#2ecc71; color:white;" onclick="ajouterNouvelleRuche()">+ Ruche</button>
        <button class="btn-add" style="background:#f1c40f; color:black;" onclick="ouvrirPromptRang()">+ Bloc</button>
        <button class="btn-add" style="background:#34495e; color:white;" onclick="exporterRucher()">💾 Export</button>
        <label class="btn-add" style="background:#34495e; color:white; cursor:pointer;">
            📂 Import <input type="file" id="import-file" style="display:none" onchange="importerRucher(event)">
        </label>
    </div>
</header>

<div id="grille-libre"></div>

<div id="nav-controls">
    <button onclick="zoom(1.2)">+</button>
    <button onclick="zoom(0.8)">-</button>
    <button onclick="recentrer()">🎯</button>
</div>

<div id="modal-visite" class="modal">
    <div class="modal-content">
        <h2 id="modal-titre">Ruche</h2>
        
        <div id="menu-choix">
            <button style="background: var(--success) !important;" onclick="afficherFormulaire()">📝 Nouvelle Visite</button>
            <button style="background: var(--success) !important;" onclick="afficherHistorique()">📜 Historique</button>
            <button style="background: var(--purple) !important;" onclick="afficherElevage()">👑 Élevage de reine</button>
            <hr>
            <button style="background: var(--orange) !important;" onclick="basculerTypeRuche()">🔄 Ruche / Ruchette</button>
            <button style="background: #2c2c2c !important;" onclick="modifierNomRuche()">✏️ Renommer</button>
            <button style="background: var(--danger) !important;" onclick="supprimerRucheDefinitif()">🗑️ Supprimer</button>
            <button style="background: #444 !important;" onclick="fermerModal()">Fermer</button>
        </div>

        <div id="ecran-formulaire" style="display:none">
            <h3>Nouvelle Visite</h3>
            <select id="note-ruche">
                <option value="S">S - Très Forte</option>
                <option value="A">A - Normale</option>
                <option value="B">B - Faible</option>
                <option value="C">C - À Surveiller</option>
            </select>
            <input type="number" id="cadre-couvain" placeholder="Nb cadres couvain">
            <input type="number" id="cadre-reserve" placeholder="Nb cadres réserves">
            <textarea id="notes-visite" placeholder="Observations..."></textarea>
            <button class="btn-save" onclick="sauvegarderVisite()">Valider</button>
            <button class="btn-cancel" onclick="revenirAuMenu()">Retour</button>
        </div>

        <div id="ecran-historique" style="display:none">
            <h3>Historique</h3>
            <div id="liste-historique"></div>
            <button class="btn-cancel" onclick="revenirAuMenu()">Retour</button>
        </div>

        <div id="ecran-elevage" style="display:none">
            <h3>Élevage de Reine</h3>
            <div id="info-elevage-vide">
                <p>Aucun cycle en cours.</p>
                <button class="btn-save" onclick="demarrerCycle()">Lancer un cycle (J0)</button>
            </div>
            <div id="calendrier-actif" style="display:none">
                <div id="liste-dates-elevage"></div>
                <button class="btn-cancel" style="background:var(--danger)!important" onclick="stopperCycle()">Arrêter l'élevage</button>
            </div>
            <button class="btn-cancel" onclick="revenirAuMenu()">Retour</button>
        </div>
    </div>
</div>

<div id="modal-rang" class="modal">
    <div class="modal-content">
        <h3>Nouveau Bloc</h3>
        <input type="text" id="nom-rang-input" placeholder="Nom du bloc (ex: Rang A)">
        <select id="orientation-rang-input">
            <option value="row">Horizontal</option>
            <option value="column">Vertical</option>
        </select>
        <button class="btn-save" onclick="creerRang()">Créer</button>
        <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
    </div>
</div>

<div id="modal-edit-rang" class="modal">
    <div class="modal-content">
        <h3>Modifier le Bloc</h3>
        <input type="text" id="edit-nom-rang">
        <input type="color" id="edit-couleur-rang" style="height:50px">
        <button class="btn-save" onclick="validerEditRang()">Enregistrer</button>
        <button class="btn-cancel" style="background:var(--danger)!important" onclick="supprimerRangActuel()">Supprimer le bloc</button>
        <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
    </div>
</div>

<div id="modal-type" class="modal">
    <div class="modal-content">
        <h3>Type & Destination</h3>
        <select id="select-rang-destination"></select>
        <button class="btn-save" onclick="validerType('RUCHE')">RUCHE</button>
        <button class="btn-save" style="background:var(--orange)!important" onclick="validerType('RUCHETTE')">RUCHETTE</button>
        <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
